name: CI/CD Pipeline - Veterinarska Apoteka

# 1. Okidači: Pokretanje na svaki push ili pull request ka glavnoj grani
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # FAZA 1: Kontinuirana Integracija (CI)
  # ----------------------------------------------------
  ci-build-and-test:
    runs-on: ubuntu-latest

    # Pokretanje MySQL kontejnera unutar CI okruženja za potrebe testiranja
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vet_apoteka_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      # Preuzimanje koda iz repozitorijuma
      - name: Checkout koda
        uses: actions/checkout@v4

      # Podešavanje PHP okruženja sa potrebnim ekstenzijama
      - name: Postavljanje PHP runtime-a
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo, pdo_mysql, mbstring
          coverage: none

      # Provera sintaksne ispravnosti svih PHP datoteka (Linting)
      - name: PHP Sintaksna provera (Lint)
        run: |
          find . -type f -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      # Statička analiza koda radi detekcije logičkih grešaka i ranjivosti
      - name: Pokretanje statičke analize (PHPStan)
        run: |
          composer require --dev phpstan/phpstan
          vendor/bin/phpstan analyse core modules --level=5 --memory-limit=1G

      # Import DDL šeme u testnu bazu radi verifikacije relacionog integriteta
      - name: Verifikacija DDL šeme baze podataka
        run: |
          mysql -h 127.0.0.1 -u root -proot vet_apoteka_test < vetv1.sql


